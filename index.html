<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="player">
    <header class="header">
      <h2>WAVEFORM</h2>
      <span class="status">● MUSIC PLAYER</span>
    </header>

    <section class="cover">
      <div class="record">
        <div class="record-center">♫</div>
      </div>
      <p>YOUR MUSIC, YOUR MOMENT</p>
    </section>

    <section class="track">
      <p class="label">NOW PLAYING</p>
      <h1 id="songTitle">SoundHelix Song 1</h1>
      <p id="artist">Demo Artist</p>
    </section>

    <div class="progress-container">
      <span id="currentTime">0:00</span>
      <input
        type="range"
        id="progress"
        min="0"
        max="100"
        value="0"
        aria-label="Song progress"
      >
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="prev" aria-label="Previous song">⏮</button>
      <button id="play" class="play-button" aria-label="Play">▶</button>
      <button id="next" aria-label="Next song">⏭</button>
    </div>

    <div class="volume-container">
      <span>🔈</span>
      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.05"
        value="0.7"
        aria-label="Volume"
      >
      <span>🔊</span>
    </div>

    <section class="playlist">
      <h2>My Playlist</h2>
      <div id="songList"></div>
    </section>

    <p class="footer">Exclusive Music </p>

    <audio id="audio" preload="metadata"></audio>
  </main>

  <script src="script.js"></script>
</body>
</html>
